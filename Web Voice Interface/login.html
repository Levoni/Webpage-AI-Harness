<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      background: #f7f7f9;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 1rem;
      background: #1a1a2e;
      color: #fff;
    }

    h1 { margin: 0; text-align: center; }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      margin-top: 2rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #333;
    }

    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1a1a2e;
      color: #fff;
    }

    #status {
      min-height: 1.5em;
      color: #c0392b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ai Model Audio Prompt</h1>
  </header>
  <script src="api-config.js"></script>

  <div class="card">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <div style="display:flex; flex-direction:column; gap:0.75rem;">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </div>
      <p id="status"></p>
    </form>
  </div>

  <script>
    const TOKEN_COOKIE = "auth_token";
    const status = document.getElementById("status");

    function getCookie(name) {
      const parts = document.cookie.split(";");
      for (const part of parts) {
        const idx = part.indexOf("=");
        if (idx > -1 && part.slice(0, idx) === name) {
          return part.slice(idx + 1);
        }
      }
      return null;
    }

    function setCookie(name, value) {
      document.cookie = name + "=" + encodeURIComponent(value) + "; path=/";
    }

    function extractToken(data) {
      if (data == null) return null;
      if (typeof data === "string") return data.trim() ? data : null;
      const keys = [
        "token",
        "access_token",
        "bearer_token",
        "bearer",
        "accessToken",
        "jwt",
        "id_token",
      ];
      const pick = (o) => {
        if (o && typeof o === "object") {
          for (const k of keys) {
            if (typeof o[k] === "string" && o[k]) return o[k];
          }
        }
        return null;
      };
      return pick(data) || pick(data && data.data);
    }

    // Called on load: if a token cookie already exists, verify it against
    // /api/login/verify and route to the main page on a 200 response.
    async function init() {
      const token = getCookie(TOKEN_COOKIE);
      if (token) {
        try {
          const res = await fetch(AUTH_BASE + "/login/verify", {
            method: "GET",
            headers: { Authorization: "Bearer " + token },
          });
          if (res.status === 200) {
            window.location.replace("page.html");
            return;
          }
        } catch (e) {
          // network error — fall through to show the login form
        }
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const password = document.getElementById("password").value;
      status.textContent = "Signing in...";

      try {
        const res = await fetch(AUTH_BASE + "/login/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, password }),
        });

        if (!res.ok) {
          status.textContent = "Login failed. Check your name and password.";
          return;
        }

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = text;
        }

        const token = extractToken(data);
        if (!token) {
          console.warn("Login response had no token:", data);
          status.textContent = "Unexpected response from server.";
          return;
        }

        setCookie(TOKEN_COOKIE, token);
        console.log(`token cookie set: ${TOKEN_COOKIE}=${token}`);
        console.log(`Grabbed cookie: ${getCookie(TOKEN_COOKIE)}`);
        window.location.replace("page.html");
      } catch (err) {
        console.error("Login error:", err);
        status.textContent = "Error signing in.";
      }
    });

    init();
  </script>
</body>
</html>
